<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
    <body>

        <div th:fragment="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark"
             style="width: 250px; min-height: 100vh;">
            <a href="/admin/dashboard"
               class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4 fw-bold">Admin Panel</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/admin/dashboard" class="nav-link text-white"
                       th:classappend="${activePage == 'dashboard'} ? 'active bg-primary'">Tổng quan</a>
                </li>
                <li>
                    <a href="/admin/specialties" class="nav-link text-white"
                       th:classappend="${activePage == 'specialties'} ? 'active bg-primary'">Quản lý Chuyên khoa</a>
                </li>
                <li>
                    <a href="/admin/doctors" class="nav-link text-white"
                       th:classappend="${activePage == 'doctors'} ? 'active bg-primary'">Quản lý Bác sĩ</a>
                </li>
                <li>
                    <a href="/admin/users" class="nav-link text-white"
                       th:classappend="${activePage == 'users'} ? 'active bg-primary'">Quản lý Bệnh nhân</a>
                </li>
                <li>
                    <a href="/admin/medicines" class="nav-link text-white"
                       th:classappend="${activePage == 'medicines'} ? 'active bg-primary'">Quản lý Kho thuốc</a>
                </li>
                <li>
                    <a href="/admin/dispense" class="nav-link text-white"
                       th:classappend="${activePage == 'dispense'} ? 'active bg-primary'"> Cấp phát thuốc</a>
                </li>
            </ul>
        </div>

        <header th:fragment="header"
                class="p-3 mb-3 border-bottom bg-white d-flex justify-content-between align-items-center shadow-sm">
            <h5 class="mb-0 fw-bold" th:text="${pageTitle}">Tiêu đề trang</h5>

            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle"
                   id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                    <strong th:text="${'Xin chào, ' + session.loggedInUser.username}">Admin</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownUser">
                    <li><a class="dropdown-item" href="#">Hồ sơ cá nhân</a></li>
                    <li><a class="dropdown-item" href="#">Cài đặt hệ thống</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item text-danger" href="/logout">Đăng xuất</a></li>
                </ul>
            </div>
        </header>

    </body>
</html>
