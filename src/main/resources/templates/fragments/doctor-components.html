<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
    <body>

        <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold" href="/doctor/appointments">Cổng Bác Sĩ</a>

                <div class="ms-auto d-flex align-items-center gap-3">
                    <a href="/doctor/dispense" class="text-white text-decoration-none fw-semibold">Cấp phát thuốc</a>
                    <a href="#"
                       class="text-white text-decoration-none fw-semibold"
                       data-bs-toggle="modal"
                       data-bs-target="#doctorLogoutModal">
                        Xin chào, <strong th:text="${session.loggedInUser.username}">Bác sĩ</strong>
                    </a>
                </div>
            </div>
        </nav>

        <div th:fragment="logoutModal" class="modal fade" id="doctorLogoutModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Đăng xuất</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Bạn có muốn đăng xuất khỏi tài khoản bác sĩ không?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
                        <a href="/logout" class="btn btn-danger btn-sm">Đăng xuất</a>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
