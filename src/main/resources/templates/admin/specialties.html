<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Quản lý Chuyên khoa - Admin Panel</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <style>body {
            font-family: 'Inter', sans-serif;
        }</style>
    </head>
    <body class="bg-light">
        <div class="d-flex">
            <div th:replace="~{fragments/admin-components :: sidebar (activePage='specialties')}"></div>

            <div class="w-100 overflow-hidden">
                <div th:replace="~{fragments/admin-components :: header (pageTitle='Quản lý Chuyên khoa')}"></div>

                <div class="container-fluid p-4">
                    <div th:if="${param.success == 'deleted'}" class="alert alert-success alert-dismissible fade show" role="alert">
                        Đã xóa chuyên khoa thành công.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${param.error == 'hasDoctor'}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        Không thể xóa chuyên khoa vì vẫn còn bác sĩ thuộc chuyên khoa này.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${param.error == 'notfound'}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        Không tìm thấy chuyên khoa cần xóa.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-4">
                            <div class="card shadow-sm border-0 border-top border-primary border-4 p-4">
                                <h5 class="fw-bold mb-3 text-primary">Thêm Chuyên khoa mới</h5>

                                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                                <form th:action="@{/admin/specialties/save}" method="post" th:object="${newSpecialty}" novalidate>
                                    <input type="hidden" th:field="*{id}">

                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Tên chuyên khoa</label>
                                        <input type="text" th:field="*{name}" class="form-control"
                                               placeholder="VD: Khoa Nội Tổng Quát"
                                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                             th:errors="*{name}"></div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Mô tả chi tiết</label>
                                        <textarea th:field="*{description}" class="form-control" rows="4"
                                                  placeholder="Mô tả chức năng của khoa..."></textarea>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100 fw-bold">Lưu Chuyên khoa</button>
                                </form>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <div class="card shadow-sm border-0 h-100">
                                <div class="card-body p-4">
                                    <h5 class="fw-bold mb-3">Danh sách Khoa hiện tại</h5>
                                    <div class="table-responsive">
                                        <table class="table table-hover align-middle">
                                            <thead class="table-light">
                                                <tr>
                                                    <th>ID</th>
                                                    <th>Tên Chuyên Khoa</th>
                                                    <th>Mô tả</th>
                                                    <th>Hành động</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr th:each="s : ${specialties}">
                                                    <td th:text="${s.id}"></td>
                                                    <td th:text="${s.name}" class="fw-bold text-primary"></td>
                                                    <td th:text="${s.description}"></td>
                                                    <td>
                                                        <a th:href="@{/admin/specialties/delete/{id}(id=${s.id})}" class="btn btn-sm btn-outline-danger"
                                                           onclick="return confirm('Bạn chắc chắn muốn xóa chuyên khoa này?')">Xóa</a>
                                                    </td>
                                                </tr>
                                                <tr th:if="${#lists.isEmpty(specialties)}">
                                                    <td colspan="4" class="text-center text-muted py-4">Chưa có dữ liệu
                                                        chuyên khoa nào.
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
