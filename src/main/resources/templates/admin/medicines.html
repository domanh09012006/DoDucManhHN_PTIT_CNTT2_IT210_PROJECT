<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Kho thuốc - Admin Panel</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="d-flex">
            <div th:replace="~{fragments/admin-components :: sidebar (activePage='medicines')}"></div>
            <div class="w-100">
                <div th:replace="~{fragments/admin-components :: header (pageTitle='Quản lý Kho thuốc')}"></div>

                <div class="container-fluid p-4">
                    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <strong>Thành công!</strong> Dữ liệu thuốc đã được lưu thành công.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${param.deleted}" class="alert alert-info alert-dismissible fade show" role="alert">
                        <strong>Thành công!</strong> Thuốc đã được xóa khỏi kho.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="card shadow-sm border-0 p-3">
                                <h5 class="fw-bold mb-3">
                                    <span th:if="${newMedicine.id == null}">Thêm Thuốc Mới</span>
                                    <span th:if="${newMedicine.id != null}">Cập Nhật Thuốc</span>
                                </h5>
                                <form th:action="@{/admin/medicines/save}" method="post" th:object="${newMedicine}" novalidate>
                                    <input type="hidden" th:field="*{id}">

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Tên thuốc <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{name}"
                                               th:class="${#fields.hasErrors('name') ? 'form-control is-invalid' : 'form-control'}"
                                               placeholder="Vd: Paracetamol 500mg" required>
                                        <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback d-block text-danger small">
                                            <span th:errors="*{name}"></span>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Nhà sản xuất</label>
                                        <input type="text" th:field="*{manufacturer}"
                                               class="form-control"
                                               placeholder="Vd: Pharmex">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Số lượng <span class="text-danger">*</span></label>
                                        <input type="number" th:field="*{quantity}"
                                               th:class="${#fields.hasErrors('quantity') ? 'form-control is-invalid' : 'form-control'}"
                                               min="0" placeholder="0" required>
                                        <div th:if="${#fields.hasErrors('quantity')}" class="invalid-feedback d-block text-danger small">
                                            <span th:errors="*{quantity}"></span>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                                        <input type="number" th:field="*{price}"
                                               th:class="${#fields.hasErrors('price') ? 'form-control is-invalid' : 'form-control'}"
                                               min="1000" step="1000" placeholder="1000" required>
                                        <div th:if="${#fields.hasErrors('price')}" class="invalid-feedback d-block text-danger small">
                                            <span th:errors="*{price}"></span>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Mô tả</label>
                                        <textarea th:field="*{description}"
                                                  class="form-control"
                                                  rows="3"
                                                  placeholder="Nhập mô tả thuốc..."></textarea>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary fw-bold">
                                            <span th:if="${newMedicine.id == null}">Thêm Thuốc</span>
                                            <span th:if="${newMedicine.id != null}">Cập Nhật</span>
                                        </button>
                                        <a href="/admin/medicines" class="btn btn-secondary fw-bold">Hủy</a>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <div class="card shadow-sm border-0 p-3">
                                <h5 class="fw-bold mb-3">Danh Sách Thuốc Trong Kho</h5>
                                <div class="table-responsive">
                                    <table class="table table-hover table-striped">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Tên Thuốc</th>
                                                <th>Nhà SX</th>
                                                <th>Số Lượng</th>
                                                <th>Giá (VNĐ)</th>
                                                <th>Hành Động</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="m : ${medicines}">
                                                <td class="text-muted small">#<span th:text="${m.id}"></span></td>
                                                <td class="fw-bold text-primary" th:text="${m.name}"></td>
                                                <td th:text="${m.manufacturer != null and !m.manufacturer.isEmpty() ? m.manufacturer : '-'}"></td>
                                                <td>
                                                    <span th:if="${m.quantity > 10}" class="badge bg-success">
                                                        <span th:text="${m.quantity}"></span> cái
                                                    </span>
                                                    <span th:if="${m.quantity <= 10 and m.quantity > 0}" class="badge bg-warning">
                                                        <span th:text="${m.quantity}"></span> cái
                                                    </span>
                                                    <span th:if="${m.quantity == 0}" class="badge bg-danger">
                                                        Hết hàng
                                                    </span>
                                                </td>
                                                <td th:text="${#numbers.formatDecimal(m.price, 0, 'COMMA', 0, 'POINT') + 'đ'}"></td>
                                                <td>
                                                    <a th:href="@{/admin/medicines/edit/{id}(id=${m.id})}"
                                                       class="btn btn-sm btn-primary fw-bold me-1">Sửa</a>
                                                    <a th:href="@{/admin/medicines/delete/{id}(id=${m.id})}"
                                                       class="btn btn-sm btn-danger fw-bold"
                                                       onclick="return confirm('Bạn chắc chắn muốn xóa thuốc này?')">Xóa</a>
                                                </td>
                                            </tr>
                                            <tr th:if="${#lists.isEmpty(medicines)}">
                                                <td colspan="6" class="text-center text-muted py-4">
                                                    Chưa có thuốc nào trong kho. Hãy thêm mới!
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
