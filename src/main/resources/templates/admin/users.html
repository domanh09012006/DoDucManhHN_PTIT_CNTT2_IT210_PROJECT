<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Quản lý Bệnh nhân - Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <style>body {
            font-family: 'Inter', sans-serif;
        }</style>
    </head>
    <body class="bg-light">

        <div class="d-flex">
            <div th:replace="~{fragments/admin-components :: sidebar (activePage='users')}"></div>

            <div class="w-100 overflow-hidden">
                <div th:replace="~{fragments/admin-components :: header (pageTitle='Quản lý Bệnh nhân')}"></div>

                <div class="container-fluid p-4">
                    <div class="card shadow-sm border-0 border-top border-success border-4">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold text-success">Danh sách Bệnh nhân</h5>
                        </div>
                        <div class="card-body">

                            <div th:if="${param.success}" class="alert alert-success border-0 shadow-sm py-2">
                                Xóa tài khoản bệnh nhân thành công!
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Tên đăng nhập</th>
                                            <th>Email</th>
                                            <th>Hành động</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="p : ${patients}">
                                            <td th:text="${p.id}"></td>
                                            <td th:text="${p.username}" class="fw-bold text-success"></td>
                                            <td th:text="${p.email}"></td>
                                            <td>
                                                <a th:href="@{/admin/users/delete/{id}(id=${p.id})}"
                                                   class="btn btn-sm btn-outline-danger"
                                                   onclick="return confirm('Bạn có chắc chắn muốn xóa bệnh nhân này khỏi hệ thống?')">Xóa
                                                    tài khoản</a>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(patients)}">
                                            <td colspan="4" class="text-center text-muted py-4">Chưa có bệnh nhân nào
                                                đăng ký hệ thống.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
