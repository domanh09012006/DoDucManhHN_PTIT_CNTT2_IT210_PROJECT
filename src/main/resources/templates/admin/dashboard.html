<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Admin Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <div class="d-flex">
            <div th:replace="~{fragments/admin-components :: sidebar (activePage='dashboard')}"></div>

            <div class="w-100 overflow-hidden">
                <div th:replace="~{fragments/admin-components :: header (pageTitle='Tổng quan hệ thống')}"></div>

                <div class="container-fluid p-4">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="card shadow-sm border-primary border-start border-5 text-center p-3">
                                <h5 class="text-muted">Tổng số Thuốc</h5>
                                <h2 class="fw-bold" th:text="${totalMedicines}">0</h2>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm border-success border-start border-5 text-center p-3">
                                <h5 class="text-muted">Tài khoản Bệnh nhân</h5>
                                <h2 class="fw-bold" th:text="${totalPatients}">0</h2>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm border-warning border-start border-5 text-center p-3">
                                <h5 class="text-muted">Tổng Lịch khám</h5>
                                <h2 class="fw-bold" th:text="${totalAppointments}">0</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
