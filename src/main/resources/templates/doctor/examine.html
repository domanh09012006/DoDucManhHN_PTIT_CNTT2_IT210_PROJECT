<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Khám bệnh & Kê đơn</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div th:replace="~{fragments/doctor-components :: navbar}"></div>
        <div th:replace="~{fragments/doctor-components :: logoutModal}"></div>

        <div class="container p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-primary">Viết Hồ sơ Bệnh án</h3>
                <a href="/doctor/appointments" class="btn btn-outline-secondary">Quay lại lịch khám</a>
            </div>

            <div th:if="${sysError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Lỗi!</strong> <span th:text="${sysError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/doctor/appointments/examine/{id}/save(id=${appointment.id})}" method="post"
                  th:object="${record}" novalidate>
                <div class="row g-4">

                    <div class="col-md-5">
                        <div class="card shadow-sm border-0 border-top border-primary border-4">
                            <div class="card-body">
                                <h5 class="fw-bold mb-3">Thông tin chẩn đoán</h5>
                                <p class="mb-1 text-muted small">Bệnh nhân: <strong class="text-dark"
                                                                                    th:text="${appointment.patient.username}"></strong>
                                </p>
                                <p class="mb-3 text-muted small">Lý do khám: <span class="text-dark"
                                                                                   th:text="${appointment.reason}"></span>
                                </p>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small">Chẩn đoán bệnh (*)</label>
                                    <textarea th:field="*{diagnosis}"
                                              th:class="${#fields.hasErrors('diagnosis') ? 'form-control is-invalid' : 'form-control'}"
                                              rows="3"
                                              placeholder="Ghi rõ tình trạng bệnh..."></textarea>
                                    <div th:if="${#fields.hasErrors('diagnosis')}" class="invalid-feedback d-block small">
                                        <span th:errors="*{diagnosis}"></span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small">Hướng điều trị / Dặn dò</label>
                                    <textarea th:field="*{treatmentPlan}" class="form-control" rows="3"
                                              placeholder="Ví dụ: Nghỉ ngơi nhiều, kiêng đồ dầu mỡ..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-7">
                        <div class="card shadow-sm border-0 border-top border-success border-4 h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5 class="fw-bold">Đơn thuốc chỉ định</h5>
                                    <button type="button" class="btn btn-sm btn-success" onclick="addMedicineRow()">Thêm thuốc</button>
                                </div>

                                <div class="table-responsive">
                                    <table class="table align-middle" id="prescriptionTable">
                                        <thead class="table-light small">
                                            <tr>
                                                <th style="width: 40%">Tên thuốc</th>
                                                <th style="width: 20%">Số lượng</th>
                                                <th style="width: 30%">Cách dùng</th>
                                                <th style="width: 10%">Xóa</th>
                                            </tr>
                                        </thead>
                                        <tbody id="prescriptionBody">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold px-5">LƯU BỆNH ÁN & HOÀN THÀNH</button>
                </div>
            </form>
        </div>

        <table style="display: none;">
            <tbody id="rowTemplate">
                <tr>
                    <td>
                        <select name="medicineIds" class="form-select form-select-sm">
                            <option value="">-- Chọn thuốc --</option>
                            <option th:each="m : ${medicines}" th:value="${m.id}"
                                    th:text="${m.name + ' (Kho: ' + m.quantity + ')'}"></option>
                        </select>
                    </td>
                    <td><input type="number" name="dosages" class="form-control form-control-sm"
                               placeholder="SL"></td>
                    <td><input type="text" name="instructions" class="form-control form-control-sm"
                               placeholder="VD: Sáng 1, Tối 1"></td>
                    <td>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                                onclick="this.closest('tr').remove()">X
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <script>
            function addMedicineRow() {
                const template = document.getElementById('rowTemplate').innerHTML;
                document.getElementById('prescriptionBody').insertAdjacentHTML('beforeend', template);
            }

            window.onload = function () {
                addMedicineRow();
            };
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
