<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Đăng ký - Nền tảng Y tế Số</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light d-flex align-items-center" style="height: 100vh;">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow border-0 rounded-3">
                        <div class="card-header bg-success text-white text-center py-3">
                            <h4 class="mb-0">ĐĂNG KÝ TÀI KHOẢN</h4>
                        </div>
                        <div class="card-body p-4">
                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                            <form action="/register" method="post" th:object="${authDTO}">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên đăng nhập</label>
                                    <input type="text" th:field="*{username}" class="form-control" placeholder="Nhập username..." th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Email liên hệ</label>
                                    <input type="text" th:field="*{email}" class="form-control" placeholder="nguyenvana@gmail.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Mật khẩu</label>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="Tạo mật khẩu an toàn..." th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                <button type="submit" class="btn btn-success w-100 fw-bold py-2">TẠO TÀI KHOẢN</button>
                            </form>

                            <div class="mt-4 text-center">
                                <p class="mb-0 text-muted">Đã có tài khoản? <a href="/login" class="text-decoration-none fw-bold text-success">Đăng nhập</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
