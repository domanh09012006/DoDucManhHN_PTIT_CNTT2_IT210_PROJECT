<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Đăng nhập - Nền tảng Y tế Số</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light d-flex align-items-center" style="height: 100vh;">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow border-0 rounded-3">
                        <div class="card-header bg-primary text-white text-center py-3">
                            <h4 class="mb-0">ĐĂNG NHẬP HỆ THỐNG</h4>
                        </div>
                        <div class="card-body p-4">
                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                            <div th:if="${param.registered}" class="alert alert-success">Đăng ký thành công! Vui lòng
                                đăng nhập.
                            </div>

                            <form action="/login" method="post" th:object="${loginDTO}" novalidate>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên đăng nhập</label>
                                    <input type="text" th:field="*{username}" class="form-control"
                                           placeholder="Nhập username..."
                                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                         th:errors="*{username}"></div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Mật khẩu</label>
                                    <input type="password" th:field="*{password}" class="form-control"
                                           placeholder="Nhập mật khẩu..."
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ĐĂNG NHẬP</button>
                            </form>

                            <div class="mt-4 text-center">
                                <p class="mb-0 text-muted">Chưa có tài khoản? <a href="/register"
                                                                                 class="text-decoration-none fw-bold">Đăng
                                    ký ngay</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
