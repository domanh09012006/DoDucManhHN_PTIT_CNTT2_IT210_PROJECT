<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Hồ Sơ Cá Nhân - Rikkei Hospital</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: 'Inter', sans-serif;
            }

            .card {
                border-radius: 12px;
            }
        </style>
    </head>
    <body class="bg-light">

        <div th:replace="~{fragments/patient-components :: navbar (activePage='profile')}"></div>
        <div th:replace="~{fragments/patient-components :: logoutModal}"></div>

        <div class="container mt-5 mb-5">
            <div class="row">

                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm border-0 text-center p-4">

                        <h4 class="fw-bold mb-1"
                            th:text="${profile.fullName != null and !profile.fullName.isEmpty()} ? ${profile.fullName} : ${session.loggedInUser.username}">
                            Tên người dùng
                        </h4>

                        <p class="text-muted mb-3" th:text="${userEmail}">email@example.com</p>

                        <div class="d-grid gap-2">
                        <span class="badge bg-success-subtle text-success border border-success-subtle py-2 fs-6 rounded-pill">
                            Vai trò: Bệnh nhân
                        </span>
                        </div>

                        <hr class="my-4 text-muted">
                        <div class="text-start">
                            <small class="text-uppercase fw-bold text-muted" style="font-size: 0.75rem;">Trạng thái tài
                                khoản</small>
                            <p class="mb-0 text-success small">● Đang hoạt động</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white border-bottom py-3">
                            <h5 class="mb-0 fw-bold text-success">Cập Nhật Thông Tin Cá Nhân</h5>
                        </div>
                        <div class="card-body p-4">

                            <div th:if="${param.success}"
                                 class="alert alert-success alert-dismissible fade show border-0 shadow-sm"
                                 role="alert">
                                <strong>Tuyệt vời!</strong> Hồ sơ của bạn đã được cập nhật thành công.
                                <button type="button" class="btn-close" data-bs-dismiss="alert"
                                        aria-label="Close"></button>
                            </div>

                            <form action="/patient/profile" method="post" th:object="${profile}" novalidate>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label for="usernameDisplay" class="form-label text-muted small fw-bold">Tên đăng nhập</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-0">@</span>
                                            <input id="usernameDisplay" type="text" class="form-control bg-light border-0"
                                                   th:value="${session.loggedInUser.username}" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="emailDisplay" class="form-label text-muted small fw-bold">Email đăng ký</label>
                                        <input id="emailDisplay" type="text" class="form-control bg-light border-0"
                                               th:value="${userEmail}" disabled>
                                    </div>
                                </div>

                                <h6 class="fw-bold text-dark mb-3">Thông tin y tế cơ bản</h6>

                                <div class="mb-3">
                                    <label for="fullName" class="form-label fw-bold">Họ và Tên đầy đủ <span class="text-danger">*</span></label>
                                    <input id="fullName" type="text" th:field="*{fullName}"
                                           th:class="${#fields.hasErrors('fullName') ? 'form-control border-2 border-danger' : 'form-control border-2'}"
                                           placeholder="Ví dụ: Đỗ Đức Mạnh">
                                    <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small mt-1">
                                        <span th:errors="*{fullName}"></span>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label fw-bold">Số điện thoại liên lạc <span class="text-danger">*</span></label>
                                            <input id="phone" type="text" th:field="*{phone}"
                                                   th:class="${#fields.hasErrors('phone') ? 'form-control border-2 border-danger' : 'form-control border-2'}"
                                                   placeholder="Nhập số điện thoại...">
                                        <div th:if="${#fields.hasErrors('phone')}" class="text-danger small mt-1">
                                            <span th:errors="*{phone}"></span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="gender" class="form-label fw-bold">Giới tính</label>
                                        <select id="gender" th:field="*{gender}" class="form-select border-2">
                                            <option value="">-- Chọn giới tính --</option>
                                            <option value="Nam">Nam</option>
                                            <option value="Nữ">Nữ</option>
                                            <option value="Khác">Khác</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="address" class="form-label fw-bold">Địa chỉ thường trú <span class="text-danger">*</span></label>
                                    <textarea id="address" th:field="*{address}"
                                              th:class="${#fields.hasErrors('address') ? 'form-control border-2 border-danger' : 'form-control border-2'}"
                                              rows="3" placeholder="Số nhà, tên đường, xã/phường..."></textarea>
                                    <div th:if="${#fields.hasErrors('address')}" class="text-danger small mt-1">
                                        <span th:errors="*{address}"></span>
                                    </div>
                                </div>

                                <div class="border-top pt-4 d-flex justify-content-between align-items-center">
                                    <p class="small text-muted mb-0">Lần cuối cập nhật: <span
                                            class="fw-bold">Vừa xong</span></p>
                                    <div>
                                        <button type="reset" class="btn btn-light px-4 me-2 fw-bold border">Làm mới
                                        </button>
                                        <button type="submit" class="btn btn-success px-5 fw-bold shadow-sm">LƯU HỒ SƠ
                                        </button>
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
